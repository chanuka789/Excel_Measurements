<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DWFx Measure · 3D window</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/", "three-mesh-bvh": "/vendor/bvh/index.js" } }
</script>
<link rel="stylesheet" href="css/app.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }
  .wtop { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-bottom: 1px solid var(--stroke2); flex: none; }
  .wtop .ctx { flex: 1; min-width: 0; }
  .wtop strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wtop span { font-size: 12px; color: var(--fg3); }
  .wmain { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr; }
  .wmain.split { grid-template-columns: minmax(0, 1fr) 6px minmax(260px, var(--side, 40%)); }
  .w3d { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--viewer); }
  .w3d .vstage { flex: 1; }
  .wgrip { background: var(--bg2); cursor: ew-resize; border-left: 1px solid var(--stroke2); border-right: 1px solid var(--stroke2); }
  .wside { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
  .wside .tabs { flex: none; }
  .wside .wbody { flex: 1; min-height: 0; overflow: auto; padding: 10px; }
  .wside #drawingHost { position: relative; display: flex; flex-direction: column; height: 100%; }
  .wside #drawingHost .dv-bar { display: flex; gap: 6px; align-items: center; padding: 6px 0; flex-wrap: wrap; }
  .wside #drawingHost .dv-bar strong { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wside #drawingHost .dv-body { flex: 1; overflow: auto; background: var(--bg3); display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px; }
  .wside canvas, .wside img, .wside svg { box-shadow: var(--shadow); background: #fff; }
</style>
</head>
<body>
  <div class="wtop">
    <div class="mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 16 16"><path d="M8 1.5 14 4.8v6.4L8 14.5 2 11.2V4.8z" fill="none" stroke="#fff" stroke-width="1.4"/><path d="M2 4.8 8 8l6-3.2M8 8v6.5" fill="none" stroke="#f2a900" stroke-width="1.4"/></svg></div>
    <div class="ctx"><strong id="wTitle">3D window</strong><span id="wSub">Connecting to the task pane…</span></div>
    <button class="btn small" id="wSide" aria-pressed="false">Drawings and properties</button>
  </div>
  <div class="wmain" id="wmain">
    <div class="w3d"><div class="vbar" id="vbar" role="toolbar" aria-label="3D view tools"></div>
      <div class="vstage" id="vstage"><div class="vinfo"><span id="pickInfo" hidden></span><span id="mInfo" hidden></span></div><div class="vload" id="vload">Waiting for the task pane…</div></div></div>
    <div class="wgrip" id="wgrip" hidden role="separator" aria-orientation="vertical" tabindex="0" aria-label="Resize side panel"></div>
    <aside class="wside" id="wside" hidden>
      <nav class="tabs" role="tablist"><button role="tab" aria-selected="true" data-st="drawings">Drawings</button><button role="tab" aria-selected="false" data-st="props">Properties</button></nav>
      <div class="wbody" id="wbody"></div>
    </aside>
  </div>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="dialog" hidden></div>
  <script type="module" src="js/window.js"></script>
</body>
</html>
