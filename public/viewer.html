<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DWFx Measure</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/", "three-mesh-bvh": "/vendor/bvh/index.js" } }
</script>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/winapp.css">
</head>
<body class="app">
  <header class="titlebar">
    <div class="mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 16 16"><path d="M8 1.5 14 4.8v6.4L8 14.5 2 11.2V4.8z" fill="none" stroke="#fff" stroke-width="1.4"/><path d="M2 4.8 8 8l6-3.2M8 8v6.5" fill="none" stroke="#f2a900" stroke-width="1.4"/></svg></div>
    <div class="ctx"><strong id="wTitle">DWFx Measure</strong><span class="sub" id="wSub">Connecting to the task pane…</span></div>
    <span id="wWin" class="wwin"></span>
  </header>
  <div id="ribbon" class="rb"></div>
  <div class="wmain left" id="wmain">
    <aside class="wleft" id="wleft" aria-label="Drawings and dimension groups">
      <section>
        <nav class="dock-tabs" role="tablist"><button role="tab" data-lt="drawings" aria-selected="true">Drawings</button><button role="tab" data-lt="layers" aria-selected="false">Layers</button><button role="tab" data-lt="model" aria-selected="false">Model</button><button role="tab" data-lt="views" aria-selected="false">Views</button><span class="sp"></span><button class="pin" id="wPin" title="Hide this pane (the ribbon View button shows it again)" aria-label="Hide the left pane">📌</button></nav>
        <div class="tree-host" id="topTree"></div>
      </section>
      <div class="hgrip" id="hgrip" role="separator" aria-orientation="horizontal" aria-label="Resize"></div>
      <section>
        <nav class="dock-tabs" role="tablist"><button role="tab" data-bt="groups" aria-selected="true">Dimension Groups</button><button role="tab" data-bt="dims" aria-selected="false">Dimensions</button><button role="tab" data-bt="auto" aria-selected="false">Auto Count</button></nav>
        <div class="dg-tools"><label for="curGroup">Current:</label><select class="input" id="curGroup" aria-label="Current dimension group"></select></div>
        <div class="dg-tools"><input class="input" id="dgFilter" type="search" placeholder="Click to Filter" aria-label="Filter dimension groups"><button class="btn small subtle" id="dgFilterX" aria-label="Clear filter">×</button></div>
        <div class="tree-host" id="dgTree"></div>
      </section>
    </aside>
    <div class="lgrip" id="lgrip" role="separator" aria-orientation="vertical" aria-label="Resize the left pane"></div>
    <div class="w3d"><nav class="ctabs" id="ctabs" role="tablist" aria-label="Open drawings and views"></nav><div class="vbar" id="vbar" role="toolbar" aria-label="3D view tools"></div>
      <div class="linkbar" id="linkbar" hidden>Drop here to link to the selected Excel cell</div>
      <div class="vstage" id="vstage"><div class="vinfo"><span id="pickInfo" hidden></span><span id="mInfo" hidden></span></div><div class="vload" id="vload">Waiting for the task pane…</div></div>
      <div class="w2d" id="w2d" hidden></div>
      <div class="wbook" id="wbook" hidden></div></div>
    <div class="wgrip" id="wgrip" hidden role="separator" aria-orientation="vertical" tabindex="0" aria-label="Resize the right pane"></div>
    <aside class="wside" id="wside" hidden>
      <nav class="dock-tabs" role="tablist"><button role="tab" aria-selected="true" data-st="drawings">Side by side</button><button role="tab" aria-selected="false" data-st="props">Properties</button><button role="tab" aria-selected="false" data-st="zones">Zones</button><span class="sp"></span><button class="pin" id="wSideX" aria-label="Close the right pane" title="Close">×</button></nav>
      <div class="wbody" id="wbody"></div>
    </aside>
  </div>
  <footer class="wstat" id="wstat" aria-live="polite"><span id="stMain"></span><span id="stCursor"></span><span id="stScale"></span><span id="stSnap"></span><span id="stLink"></span></footer>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="dialog" hidden></div>
  <script type="module" src="js/window.js"></script>
</body>
</html>
