<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }
  .wtop { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-bottom: 1px solid var(--stroke2); flex: none; }
  .wtop .ctx { flex: 1; min-width: 0; }
  .wtop strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wtop span { font-size: 12px; color: var(--fg3); }
  .wmain { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr; grid-template-areas: "c"; }
  .wmain.left { grid-template-columns: minmax(240px, var(--left, 340px)) 6px minmax(0, 1fr); }
  .wmain.split { grid-template-columns: minmax(0, 1fr) 6px minmax(260px, var(--side, 36%)); }
  .wmain.left.split { grid-template-columns: minmax(240px, var(--left, 340px)) 6px minmax(0, 1fr) 6px minmax(260px, var(--side, 32%)); }
  .w3d { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--viewer); }
  .w3d .vstage { flex: 1; }
  .wgrip, .lgrip { background: var(--bg2); cursor: ew-resize; border-left: 1px solid var(--stroke2); border-right: 1px solid var(--stroke2); }
  .wside { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
  .wside .tabs { flex: none; }
  .wside .wbody { flex: 1; min-height: 0; overflow: auto; padding: 10px; }

  .wside #drawingHost .dv-bar { display: flex; gap: 6px; align-items: center; padding: 6px 0; flex-wrap: wrap; }
  .wside #drawingHost .dv-bar strong { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wside #drawingHost .dv-body { flex: 1; overflow: auto; background: var(--bg3); display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px; }
  .wside canvas, .wside img, .wside svg { box-shadow: var(--shadow); background: #fff; }
  /* left panel: project tree (CostX style) */
  .wleft { display: grid; grid-template-rows: minmax(120px, var(--top, 42%)) 6px minmax(160px, 1fr); min-width: 0; min-height: 0; background: var(--bg); font-size: 12px; }
  .wleft { overflow: hidden; }
  .wleft section { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .wleft .tabs button { padding: 7px 8px 6px; font-size: 12px; }
  .hgrip { background: var(--bg2); cursor: ns-resize; border-top: 1px solid var(--stroke2); border-bottom: 1px solid var(--stroke2); }
  .tree-host { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: auto; }
  .tree-host > table { flex: none; }
  .tr-head { display: grid; grid-template-columns: 1fr repeat(var(--nc, 1), auto); gap: 6px; padding: 3px 8px; background: var(--bg3); border-bottom: 1px solid var(--stroke2); color: var(--fg3); font-weight: 600; flex: none; }
  .tr-head { display: flex; } .tr-head > span:first-child { flex: 1; }
  .tr-c { width: 74px; text-align: right; flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tr-body { flex: 1; overflow: auto; padding: 2px 0; }
  .tr-row { display: flex; align-items: center; gap: 4px; padding: 2px 8px 2px calc(6px + var(--d) * 14px); cursor: default; white-space: nowrap; border: 1px solid transparent; }
  .tr-row:hover { background: var(--bg-hover); }
  .tr-row:focus { outline: 1px dotted var(--stroke-strong); outline-offset: -1px; }
  .tr-row.sel { background: var(--brand-bg); border-color: var(--brand); }
  .tr-row.cur .tr-l { font-weight: 700; }
  .tr-row.muted { color: var(--fg3); }
  .tr-row.drop { background: var(--pick-bg); border-color: var(--pick); }
  .tr-tw { width: 12px; flex: none; color: var(--fg3); cursor: pointer; text-align: center; }
  .tr-l { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .tr-ic { width: 14px; height: 14px; flex: none; border-radius: 2px; background: var(--fg3); }
  .tr-folder, .tr-std { background: #dcb35c; border-radius: 1px 4px 2px 2px; height: 11px; }
  .tr-std { background: #8a9aa6; }
  .tr-model, .tr-open { background: none; border: 2px solid var(--brand); transform: rotate(45deg) scale(.75); }
  .tr-open { background: var(--brand); }
  .tr-version { background: none; border: 1.5px solid var(--fg3); border-radius: 50%; transform: scale(.7); }
  .tr-drawing, .tr-sheet { background: #fff; border: 1.5px solid var(--brand); border-radius: 1px; }
  .tr-sheet { border-style: dashed; }
  .tr-file { background: none; border: 1.5px solid var(--fg3); }
  .tr-cat, .tr-fam, .tr-type, .tr-view, .tr-item { background: none; border: 1.5px solid var(--fg3); transform: scale(.7); }
  .tr-dg-count { background: #107c10; border-radius: 50%; transform: scale(.75); }
  .tr-dg-length { background: linear-gradient(transparent 40%, #2f6fa3 40% 60%, transparent 60%); }
  .tr-dg-area { background: #3f8f8a; opacity: .85; }
  .tr-dg-volume { background: #c98a2b; box-shadow: inset -3px -3px 0 rgba(0,0,0,.25); }
  .tr-empty { padding: 10px; }
  .dg-tools { display: flex; gap: 6px; align-items: center; padding: 4px 8px; flex: none; border-bottom: 1px solid var(--stroke2); }
  .dg-tools select, .dg-tools input { min-width: 0; flex: 1; height: 26px; font-size: 12px; }
  .dims-bar { display: flex; gap: 8px; align-items: center; padding: 6px 8px; }

  table.dims { font-size: 12px; table-layout: fixed; width: 100%; }

  table.dims th:nth-child(1) { width: 30px; } table.dims th:nth-child(3) { width: 22%; } table.dims th:nth-child(4), table.dims th:nth-child(5) { width: 64px; }
  .tr-cat, .tr-fam, .tr-type { border-radius: 50%; } table.dims tr.sel td { background: var(--brand-bg); } table.dims tr.neg td { color: var(--bad); } table.dims tr { cursor: default; }
  .wstat { flex: none; padding: 3px 12px; border-top: 1px solid var(--stroke2); font-size: 12px; color: var(--fg2); white-space: pre; overflow: hidden; text-overflow: ellipsis; min-height: 22px; }
  /* context menus (CostX style) */
  .cmenu { position: fixed; z-index: 60; }
  .cm-list { position: absolute; min-width: 210px; background: var(--bg); color: var(--fg); border: 1px solid var(--stroke); border-radius: 6px; box-shadow: var(--shadow-l); padding: 4px 0; font-size: 13px; }
  .cmenu > .cm-list { position: static; }
  .cm-item { position: relative; display: flex; align-items: center; gap: 12px; padding: 5px 14px 5px 26px; cursor: default; white-space: nowrap; outline: none; }
  .cm-item:hover, .cm-item:focus { background: var(--bg-hover); }
  .cm-item[aria-disabled="true"] { color: var(--fg-disabled); }
  .cm-item[aria-checked="true"]::before { content: "✓"; position: absolute; left: 9px; }
  .cm-label { flex: 1; } .cm-key { color: var(--fg3); } .cm-arrow { color: var(--fg2); }
  .cm-sep { height: 1px; background: var(--stroke2); margin: 4px 0; }
  /* dialogs */
  .dlg.wide { max-width: 760px; }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .dlg-x { border: 0; background: none; font-size: 20px; color: var(--fg3); cursor: pointer; padding: 0 4px; }
  .dlg.side-actions .dlg-main { display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 12px; }
  .dlg.side-actions .dlg-actions { flex-direction: column; justify-content: flex-start; margin-top: 0; }
  .dlg-body { max-height: 70vh; overflow: auto; }
  .dlg-err { color: var(--bad); min-height: 18px; margin-top: 6px; }
  .dg-tabs { padding: 0; margin-bottom: 10px; }
  .dg-pane { min-height: 360px; }
  .dg-form { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 7px 10px; align-items: center; }
  .dg-form label { color: var(--fg2); text-align: right; }
  .dg-form span input { width: 140px; }
  .dg-form input[type=color] { width: 60px; height: 26px; padding: 0; border: 1px solid var(--stroke); }
  table.edit input { width: 100%; }
  .dg-list { max-height: 300px; overflow: auto; }
  .dg-prev { margin: 8px 0; }
  tr.strike td { text-decoration: line-through; }
  .chips code { display: inline-block; margin: 2px; }
  .sch-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .sch-grid fieldset { border: 1px solid var(--stroke2); border-radius: var(--r); padding: 8px 10px; }
  .sch-grid details { margin-top: 6px; max-height: 180px; overflow: auto; }
  .sch-groups { margin-top: 10px; max-height: 120px; overflow: auto; }
  label.check { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
  @media (max-width: 760px) { .wmain.left, .wmain.left.split { grid-template-columns: 1fr; } .wleft, .lgrip { display: none; } .sch-grid { grid-template-columns: 1fr; } .dlg.side-actions .dlg-main { grid-template-columns: 1fr; } }
</style>
