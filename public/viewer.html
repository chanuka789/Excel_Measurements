<style>
  html, body { height: 100%; }

  .wleft { overflow: hidden; }

  .tr-version { background: none; border: 1.5px solid var(--fg3); border-radius: 50%; transform: scale(.7); }
  .tr-drawing, .tr-sheet { background: #fff; border: 1.5px solid var(--brand); border-radius: 1px; }

  .tr-file { background: none; border: 1.5px solid var(--fg3); }
  .tr-cat, .tr-fam, .tr-type, .tr-view, .tr-item { background: none; border: 1.5px solid var(--fg3); transform: scale(.7); }

  .tr-dg-area { background: #3f8f8a; opacity: .85; }
  .tr-qty { background: none; border-left: 2px solid var(--fg3); border-radius: 0; width: 8px; margin-left: 4px; }
  .tr-row.muted .tr-l { font-style: italic; color: var(--fg2); }
  .tr-dg-volume { background: #c98a2b; box-shadow: inset -3px -3px 0 rgba(0,0,0,.25); }
  .tr-empty { padding: 10px; }
  .dg-tools { display: flex; gap: 6px; align-items: center; padding: 4px 8px; flex: none; border-bottom: 1px solid var(--stroke2); }
  .dg-tools select, .dg-tools input { min-width: 0; flex: 1; height: 26px; font-size: 12px; }

  .tr-cat, .tr-fam, .tr-type { border-radius: 50%; } table.dims tr.sel td { background: var(--brand-bg); } table.dims tr.neg td { color: var(--bad); } table.dims tr { cursor: default; }
  .wstat { flex: none; padding: 3px 12px; border-top: 1px solid var(--stroke2); font-size: 12px; color: var(--fg2); white-space: pre; overflow: hidden; text-overflow: ellipsis; min-height: 22px; }
