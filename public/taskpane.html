<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DWFx Measure</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- sign-in -->
<main id="signin" hidden>
  <form class="signin-card" id="signinForm" novalidate>
    <div class="brandline">
      <div class="mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 16 16"><path d="M8 1.5 14 4.8v6.4L8 14.5 2 11.2V4.8z" fill="none" stroke="#fff" stroke-width="1.4"/><path d="M2 4.8 8 8l6-3.2M8 8v6.5" fill="none" stroke="#f2a900" stroke-width="1.4"/></svg></div>
      <div><h1>DWFx Measure</h1><div class="muted small">Measure drawings and 3D models, linked to Excel</div></div>
    </div>
    <label class="field">Email<input id="siEmail" type="email" autocomplete="username" required></label>
    <label class="field">Password<input id="siPw" type="password" autocomplete="current-password" required></label>
    <div id="siErr" class="msg bad" role="alert" hidden></div>
    <button class="btn primary" id="siGo">Sign in</button>
    <p class="muted small" style="margin:12px 0 0">Your administrator creates your account. Ask them if you do not have a password. <button type="button" class="link" id="siHelp">Help and training</button></p>
  </form>
</main>

<!-- app -->
<div id="shell" hidden>
  <header>
    <div class="mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 16 16"><path d="M8 1.5 14 4.8v6.4L8 14.5 2 11.2V4.8z" fill="none" stroke="#fff" stroke-width="1.4"/><path d="M2 4.8 8 8l6-3.2M8 8v6.5" fill="none" stroke="#f2a900" stroke-width="1.4"/></svg></div>
    <div class="ctx"><strong id="ctxProject">DWFx Measure</strong><span id="ctxModel">Measurements</span></div>
    <button class="avatar" id="userBtn" aria-haspopup="menu" aria-expanded="false" aria-label="Account"></button>
    <div class="menu" id="userMenu" role="menu" hidden>
      <div class="who"><strong id="umName"></strong><div class="muted small" id="umEmail"></div></div>
      <button role="menuitem" id="umTheme">Theme: follow Office</button>
      <button role="menuitem" id="umHelp">Help and training videos</button>
      <button role="menuitem" id="umKeys">Keyboard shortcuts</button>
      <button role="menuitem" id="umOut">Sign out</button>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" aria-selected="true" data-tab="meas">Measurements</button>
    <button role="tab" aria-selected="false" data-tab="project">Projects</button>
    <button role="tab" aria-selected="false" data-tab="admin" id="adminTab" hidden>Admin</button>
  </nav>

  <section class="panel on" id="tab-meas" role="tabpanel"><div id="measBody"></div></section>
  <section class="panel" id="tab-project" role="tabpanel"><div id="projectBody"></div></section>
  <section class="panel" id="tab-admin" role="tabpanel"><div id="adminBody"></div></section>

</div>

<div id="status" role="status" aria-live="polite"></div>
<div id="dialog" hidden></div>
<div id="drawingViewer" hidden role="dialog" aria-modal="true" aria-label="Drawing viewer"></div>

<script type="module" src="taskpane.js"></script>
</body>
</html>
